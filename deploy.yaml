apiVersion: v1
kind: Pod
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  containers:
    - name: flask-app
      image: nikhilesh000007/flask-app:61084c119822d05912422ba76e7c5ce2a43a1c3e
      ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: flask-app
spec:
  selector:
    app: flask-app
  ports:
    - port: 8000
      targetPort: 5000
  type: NodePort
