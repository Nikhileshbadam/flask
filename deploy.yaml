apiVersion: v1
kind: Pod
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  containers:
    - name: flask-app
      image: nikhilesh000007/flask-app:a20a2be6519939452f6baa1b853cdd53950c8654
      ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: flask-app
spec:
  selector:
    app: flask-app
  ports:
    - port: 8000
      targetPort: 5000
  type: NodePort
